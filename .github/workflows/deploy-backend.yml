name: Deploy Backend to HF Space

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub<1.0"

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN_WRITE: ${{ secrets.HF_TOKEN_WRITE }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN_WRITE"])
          repo_id = "thomas-to-bcheme/portfolio-zerogpu"
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          # Assumes the Space already exists (create it once via the HF web
          # UI if starting fresh). create_repo() is deliberately not called
          # here: HF's API gates *creating* new Gradio/Docker Space repos
          # behind a PRO subscription (402 Payment Required), even with
          # exist_ok=True on an already-existing repo. upload_folder() only
          # commits to an existing repo and isn't subject to that gate.

          # Uploads folder contents via the Hub API commit, never a git push,
          # so this can never clobber the Space's own git history.
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="backend",
              ignore_patterns=[
                  "**/.git*",
                  "**/__pycache__/*",
                  "**/*.pyc",
                  "**/.env*",
                  "**/.venv/*",
              ],
              commit_message=f"Deploy from GitHub Actions ({sha})",
          )
          PY
