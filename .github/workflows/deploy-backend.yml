name: Deploy Backend to HF Space

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub<1.0"

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN_WRITE: ${{ secrets.HF_TOKEN_WRITE }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN_WRITE"])
          repo_id = "thomas-to-bcheme/portfolio-zerogpu"
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          # Idempotent: creates the Space with the gradio SDK on first run,
          # no-ops on every subsequent run. upload_folder() alone doesn't
          # reliably bootstrap a brand-new Space repo with the right SDK.
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )

          # Uploads folder contents via the Hub API commit, never a git push,
          # so this can never clobber the Space's own git history.
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="backend",
              ignore_patterns=[
                  "**/.git*",
                  "**/__pycache__/*",
                  "**/*.pyc",
                  "**/.env*",
                  "**/.venv/*",
              ],
              commit_message=f"Deploy from GitHub Actions ({sha})",
          )
          PY
